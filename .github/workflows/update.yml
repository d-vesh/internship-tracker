name: Update internships

on:
  schedule:
    - cron: "0 14 * * *"   # every day at 7am Pacific (14:00 UTC)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape.py
      - name: Commit updates
        run: |
          git config user.name "internship-bot"
          git config user.email "internship-bot@users.noreply.github.com"
          git add README.md jobs.json
          git diff --cached --quiet || git commit -m "Update internships $(date -u +%F)"
          git push
